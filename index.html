<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
   <!-- ربط ملف المانيفست -->
<link rel="manifest" href="manifest.json">

<!-- إعدادات خاصة للآيفون (iOS) ليظهر كـ App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سجل الواجبات">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">

<!-- تحسين العرض للجوال -->
<meta name="theme-color" content="#ffffff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل الواجبات الإلكتروني</title>
    <!-- استيراد خط Kufam الفاخر والحديث -->
    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F7F6;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --teacher-color: #0047AB; /* Cobalt Blue */
            --parent-color: #00A36C;  /* Jade Green */
            --shadow: 10px 10px 20px #d1d9e6, -10px -10px 20px #fff;
            --inner-shadow: inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #fff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kufam', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* العنوان العلوي الراقي */
        .premium-header {
            text-align: center;
            padding: 40px 20px 20px;
            z-index: 10;
        }

        .premium-header h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -1px;
            display: inline-block;
            position: relative;
        }

        .premium-header h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, var(--teacher-color), var(--parent-color));
            border-radius: 2px;
        }

        /* الحاوية الرئيسية للبوابات */
        .gates-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 20px 30px 40px;
        }

        /* تصميم البوابة الفاخرة */
        .premium-gate {
            flex: 1;
            height: 100%;
            max-height: 500px;
            background: var(--bg-color);
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 30px;
            text-align: center;
        }

        /* تأثير التفاعل عند اللمس */
        .premium-gate:active {
            box-shadow: var(--inner-shadow);
            transform: scale(0.97);
        }

        /* حاوية الأيقونة */
        .icon-holder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            background: var(--bg-color);
            box-shadow: var(--inner-shadow);
            font-size: 3rem;
            transition: 0.4s;
        }

        h2 {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 10px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0 0 30px;
            line-height: 1.6;
        }

        /* زر الدخول الراقي */
        .action-button {
            padding: 12px 35px;
            border-radius: 25px;
            font-weight: 500;
            font-size: 1rem;
            transition: 0.3s;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* تدرج المعلم */
        .teacher-style .icon-holder { color: var(--teacher-color); }
        .teacher-style .action-button {
            background: linear-gradient(135deg, var(--teacher-color) 0%, #1e90ff 100%);
        }

        /* تدرج ولي الأمر */
        .parent-style .icon-holder { color: var(--parent-color); }
        .parent-style .action-button {
            background: linear-gradient(135deg, var(--parent-color) 0%, #50c878 100%);
        }

        /* تحسينات للشاشات الصغيرة جداً */
        @media (max-width: 370px) {
            .premium-header h1 { font-size: 1.5rem; }
            h2 { font-size: 1.2rem; }
            .icon-holder { width: 70px; height: 70px; font-size: 2.2rem; margin-bottom: 20px;}
        }
    </style>
</head>
<body>

    <div class="premium-header">
        <h1>سجل الواجبات الإلكتروني</h1>
    </div>

    <div class="gates-container">
        
        <!-- بوابة المعلم (يسار) - تصميم راقي -->
        <a href="https://usayd-school.github.io/teacher-gate/" class="premium-gate teacher-style">
            <div class="icon-holder">🎓</div>
            <h2>بوابة المعلم</h2>
            <p>إدارة الفصول، رصد الدرجات والواجبات اليومية.</p>
            <div class="action-button">دخول آمن</div>
        </a>

        <!-- بوابة ولي الأمر (يمين) - تصميم راقي -->
        <a href="https://usayd-school.github.io/student-view/" class="premium-gate parent-style">
            <div class="icon-holder">👨‍👩‍👦</div>
            <h2>بوابة ولي الأمر</h2>
            <p>متابعة مستوى الأبناء، الجداول والتقارير الأكاديمية.</p>
            <div class="action-button">متابعة الآن</div>
        </a>

    </div>

</body>
</html>
